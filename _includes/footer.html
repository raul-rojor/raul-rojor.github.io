<footer class="site-footer">
  <div class="shell site-footer__inner">

    <div class="site-footer__left">
      <p class="site-footer__name">{{ site.name }}</p>
      <p class="mono site-footer__meta">
        {% if site.location %}{{ site.location }} · {% endif %}Available for internships &amp; new grad roles
      </p>
    </div>

    <div class="site-footer__right">
      {% include social.html %}
      <p class="mono site-footer__legal">
        © {{ site.time | date: "%Y" }} {{ site.name }} · built with Jekyll
      </p>
    </div>

  </div>
</footer>
