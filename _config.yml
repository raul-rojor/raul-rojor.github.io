# ─────────────────────────────────────────────────────────────
#  SITE IDENTITY  —  edit these first
# ─────────────────────────────────────────────────────────────

# Your name, shown in the header and used for SEO/authorship
name: Raul Rojo Name
author: Raul Rojo Name

# One-line description used in <title>, meta tags and link previews
description: Mathematics and machine learning.

# Short role label shown under your name in the site header
role: ML / Mathematics / Software Engineering

# Where you are, shown in the footer
location: Austin, Texas

# Profile photo (also used as the link-preview image)
avatar: /images/headshot.png

# ─────────────────────────────────────────────────────────────
#  NAVIGATION  —  add or remove items here, they render in order
# ─────────────────────────────────────────────────────────────
nav:
  - title: Work
    url: /work/
  - title: About
    url: /about/

# ─────────────────────────────────────────────────────────────
#  LINKS  —  leave a value blank to hide that icon everywhere
# ─────────────────────────────────────────────────────────────
social:
  email: raulrojoname@gmail.com
  github: raul-rojor
  linkedin: raul-rojo-name        # the slug after linkedin.com/in/
  # Shows a "Resume" link in the header and a button on the home page.
  # Keep this filename in sync if you replace the file. Blank hides both links.
  resume: /images/raul-rojo-name-resume.png

# ─────────────────────────────────────────────────────────────
#  ANALYTICS  —  optional, leave blank to disable
# ─────────────────────────────────────────────────────────────
google_analytics:                  # legacy "UA-" tracking code
# google_analytics_ga4: G-XXXXXXX  # newer GA4 measurement ID

# ─────────────────────────────────────────────────────────────
#  BUILD CONFIG  —  you shouldn't need to touch anything below
# ─────────────────────────────────────────────────────────────

url: "https://raul-rojor.github.io"
enforce_ssl: "https://raul-rojor.github.io"
baseurl:

# Each project is one Markdown file in /_projects — see the README
collections:
  projects:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

include: ['_pages']

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
